name: 🐞 Bug report
description: Something is broken or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security or child-safety problem? Please don't file it here — see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to /fa/courses\n2. Tap …\n3. See …"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Site language
      options: [English, Dari (دری), Pashto (پښتو)]
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android phone, Chrome
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
