services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nextntech
      POSTGRES_PASSWORD: nextntech
      POSTGRES_DB: nextntech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextntech -d nextntech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
